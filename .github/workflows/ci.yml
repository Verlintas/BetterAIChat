name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install SDK packages
        run: '$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager platform-tools "platforms;android-36" "build-tools;36.0.0"'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:testDebugUnitTest :skills:testDebugUnitTest :providers:testDebugUnitTest --stacktrace

      - name: Assemble debug APKs (full + lite)
        run: ./gradlew :app:assembleFullDebug :app:assembleLiteDebug --stacktrace
